apiVersion: v1
kind: Namespace
metadata:
  name: staging
---
apiVersion: v1
kind: Pod
metadata:
  name: backend-pod
  namespace: staging
  labels:
    app: backend
spec:
  containers:
  - name: backend
    image: backend-app:latest
    ports:
    - containerPort: 8080
    env:
    - name: NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: staging
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  namespace: staging
  labels:
    app: frontend
spec:
  containers:
  - name: frontend
    image: frontend-app:latest
    ports:
    - containerPort: 80
